name: Daily Crypto Ingestion

on:
  schedule:
    - cron: "0 0 * * *"
  
  workflow_dispatch: 

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Set up Google Cloud Key
        run: |
          mkdir -p terraform
          echo "${{ secrets.USER_KEY}}" > terraform/USER_KEY.json

      - name: Run Extraction Script
        run: python scripts/extract_data.py